services:
  - type: web
    name: bikting-engine
    runtime: node
    plan: free
    buildCommand: npm ci && npm run verify
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: BIKTING_TEST_TOKEN
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: KNOWLEDGE_STORE_PATH
        value: data/knowledge-cache.json
