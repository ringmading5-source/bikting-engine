services:
  - type: web
    name: b-stae
    runtime: python
    plan: free
    branch: main
    rootDir: b-stae
    buildCommand: python -m pip install -r requirements.txt && python -m unittest discover -s tests -q
    startCommand: python app.py --host 0.0.0.0
    healthCheckPath: /health
    envVars:
      - key: BSTAE_ACCESS_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: PYTHONUNBUFFERED
        value: "1"
